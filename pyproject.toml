[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "array-api-negative-index"
version = "1.0.0"
description = "Utils for indexing arrays with {-n, -(n-1),..., -1, 0, 1,..., n-1, n} using array API."
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.11.2",
  "types-array-api>=1.1.4",
]
urls."Bug Tracker" = "https://github.com/34j/array-api-negative-index/issues"
urls.Changelog = "https://github.com/34j/array-api-negative-index/blob/main/CHANGELOG.md"
urls.documentation = "https://array-api-negative-index.readthedocs.io"
urls.repository = "https://github.com/34j/array-api-negative-index"

[dependency-groups]
dev = [
  "coverage",
  "numpy>=2.0.2",
  "packaging-34j[test]>=1.1.8",
  "pytest>=9",
  "pytest-cov>=7",
  "torch>=2.8",
  "ty>=0.0.10",
]
docs = [
  "packaging-34j[docs]>=1.1.8",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
